<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <circle
    cx="60" cy="60" r="10"
    fill="none"
    stroke="#4b8df8"
    stroke-width="4"
    opacity="0.9"/>
  <circle
    cx="60" cy="60" r="10"
    fill="none"
    stroke="#4b8df8"
    stroke-width="4"
    opacity="0">
    <animate attributeName="r" from="10" to="52" dur="0.45s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" from="0.9" to="0" dur="0.45s" begin="0s" fill="freeze"/>
  </circle>
</svg>
