<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Arrow Escape</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <button class="control-button" id="backButton" type="button" aria-label="Go back">
        <span class="control-icon">←</span>
      </button>

      <div class="heart-row" aria-label="Lives remaining">
        <span class="heart">❤</span>
        <span class="heart">❤</span>
        <span class="heart">❤</span>
      </div>

      <button class="control-button" id="restartButton" type="button" aria-label="Restart level">
        <span class="control-icon">↻</span>
      </button>
    </header>

    <main class="game-shell">
      <div class="board-shell">
        <div id="svgContainer" class="svg-container"></div>
      </div>
    </main>
  </div>

  <div id="gameOverOverlay" class="game-over-overlay hidden" aria-hidden="true">
    <div class="game-over-backdrop"></div>
    <div class="game-over-panel" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <h2 id="gameOverTitle">Game Over</h2>
      <p>You've lost all your hearts. Retry the level or exit to level select.</p>
      <div class="game-over-actions">
        <button id="retryOverlayButton" class="control-button" type="button">Retry Level</button>
        <button id="exitOverlayButton" class="control-button exit" type="button">Exit</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
